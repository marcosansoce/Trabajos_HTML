<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <h1>Calculadora</h1>
    <form id="formCalculadora">
      <div class="campo">
        <label for="numero1">Número 1:</label>
        <input type="number" id="numero1" placeholder="Ingrese el primer número" required>
      </div>
      <div class="campo">
        <label for="numero2">Número 2:</label>
        <input type="number" id="numero2" placeholder="Ingrese el segundo número" required>
      </div>
      <button type="submit">Calcular</button>
    </form>
    <div class="resultados" id="resultados">
        <h2>Tabla de resultados</h2>
        <table class="custom-table">
            <thead>
                <tr>
                <th>Iteración</th>
                <th>Operación</th>
                <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tablaResultados">
                <tr>
                    <td>1</td>
                    <td>Suma</td>
                    <td id="resultadoSuma"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Resta</td>
                    <td id="resultadoResta"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Multiplicación</td>
                    <td id="resultadoMultiplicacion"></td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>División</td>
                    <td id="resultadoDivision"></td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>Módulo</td>
                    <td id="resultadoModulo"></td>
                </tr>
            </tbody>
        </table>
    </div>
  </div>

  <script src="calculadora.js"></script>
